
<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="بوابة التلاميذ - Belhrach School"
  >

  <meta name="theme-color" content="#081b33">

  <title>Belhrach School | بوابة التلاميذ</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="panel">

    <!-- BRAND -->

    <header class="brand">

      <span class="mark">BS</span>

      <div>
        <h1>Belhrach School</h1>
        <p>بوابة التلاميذ</p>
      </div>

    </header>

    <!-- STUDENT REQUEST FORM -->

    <section id="formView">

      <h2>طلب تفعيل حساب</h2>

      <p class="muted">
        أدخل معلوماتك كما هي في المؤسسة، ثم أرسل طلب التفعيل.
      </p>

      <form id="requestForm">

        <label for="firstName">
          الاسم

          <input
            id="firstName"
            name="firstName"
            type="text"
            maxlength="60"
            autocomplete="given-name"
            required
          >
        </label>

        <label for="lastName">
          اللقب

          <input
            id="lastName"
            name="lastName"
            type="text"
            maxlength="60"
            autocomplete="family-name"
            required
          >
        </label>

        <label for="className">
          القسم

          <input
            id="className"
            name="className"
            type="text"
            maxlength="40"
            placeholder="مثال: 3ع1"
            required
          >
        </label>

        <button
          type="submit"
          id="submitBtn"
        >
          إرسال طلب التفعيل
        </button>

      </form>

      <p
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></p>

    </section>

    <!-- STUDENT STATUS -->

    <section id="statusView" hidden>

      <h2 id="statusTitle">
        تم إرسال طلبك
      </h2>

      <p
        id="statusText"
        class="muted"
      >
        طلبك قيد المراجعة من الإدارة.
      </p>

      <p
        id="statusMessage"
        class="message"
        role="status"
        aria-live="polite"
      ></p>

      <!-- DEVICE REGISTRATION -->

      <section aria-label="ربط الجهاز">

        <button
          type="button"
          id="registerDeviceBtn"
          hidden
        >
          ربط هذا الجهاز
        </button>

      </section>

      <!-- ATTENDANCE PANEL -->

      <section
        id="attendancePanel"
        hidden
        aria-label="الحضور اليومي"
      >

        <hr>

        <h2>الحضور اليومي</h2>

        <p class="muted">
          تحقق من هويتك باستخدام الجهاز المرتبط بحسابك لتسجيل حضورك.
        </p>

        <p>
          حالة اليوم:
          <strong
            id="attendanceStatus"
            aria-live="polite"
          >
            جارٍ تحميل الحالة...
          </strong>
        </p>

        <p
          id="attendanceDetails"
          class="muted"
        ></p>

        <button
          type="button"
          id="attendanceBtn"
        >
          تسجيل الحضور
        </button>

        <button
          type="button"
          id="refreshAttendanceBtn"
          class="secondary"
        >
          تحديث الحضور
        </button>

        <p
          id="attendanceMessage"
          class="message"
          role="status"
          aria-live="polite"
        ></p>

      </section>

      <!-- REFRESH REQUEST STATUS -->

      <button
        type="button"
        id="refreshBtn"
        class="secondary"
      >
        تحديث الحالة
      </button>

    </section>

    <!-- FOOTER -->

    <footer>
      © Belhrach School
    </footer>

  </main>

  <!-- CONFIGURATION -->

  <script src="config.js"></script>

  <!-- APPLICATION -->

  <script type="module" src="app.js"></script>

</body>

</html>
